[package]
name = "merab-echo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "merab-echo"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rmcp = { workspace = true }
futures = "0.3"
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
