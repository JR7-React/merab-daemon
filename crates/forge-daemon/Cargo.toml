[package]
name = "forge-daemon"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "forged"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../forge-core" }
forge-store = { path = "../forge-store" }
forge-transport = { path = "../forge-transport" }
forge-sandbox = { path = "../forge-sandbox" }
forge-config = { path = "../forge-config" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonrpsee = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }
bytes = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10"
hex = "0.4"
dotenv = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
