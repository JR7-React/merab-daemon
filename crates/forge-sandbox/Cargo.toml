[package]
name = "forge-sandbox"
version = "0.1.0"
edition = "2024"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
] }
anyhow = "1"
tracing = "0.1"
forge-core = { path = "../forge-core" }
