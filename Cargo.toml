[workspace]
resolver = "2"
members = [
    "crates/forge-core",
    "crates/forge-daemon",
    "crates/forge-cli",
    "crates/forge-store",
    "crates/forge-transport",
    "crates/forge-sandbox", "crates/forge-config", "crates/forge-tui",
    "crates/forge-ai", "crates/forge-echo", "crates/forge-fs", "crates/forge-shell",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
jsonrpsee = { version = "0.24", features = ["server", "client", "macros", "http-client"] }
rmcp = { version = "0.15", features = ["client", "transport-child-process"] }
