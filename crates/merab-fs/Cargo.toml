[package]
name = "merab-fs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "merab-fs"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rmcp = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
walkdir = "2"
glob = "0.3"
regex = "1"
