name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  rust:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace
