[package]
name = "merab-sandbox"
version = "0.1.0"
edition = "2024"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
] }
anyhow = "1"
tracing = "0.1"
merab-core = { path = "../merab-core" }
